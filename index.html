            ))}
          </div>
        </section>
      )}
    </div>
  );
}

  const [page, setPage] = useState("home"); // "home" | "blog" | "article"

  const [autoArticles, setAutoArticles] = useState([]);

  // Récupère les articles publiés automatiquement par le robot IA (s'il est configuré)
  useEffect(() => {
    if (!JSONBIN_READ_URL) return;
    fetch(JSONBIN_READ_URL)
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        const list = data && data.record && data.record.articles;
        if (Array.isArray(list)) setAutoArticles(list);
      })
      .catch(() => { /* silencieux : le site continue avec les articles écrits à la main */ });
  }, []);

  // Fusion : articles auto-générés en premier (plus récents), puis les articles écrits à la main,
  // sans doublons de slug
  const allArticles = useMemo(() => {
    const seen = new Set();
    const merged = [];
    for (const a of [...autoArticles, ...BLOG_ARTICLES]) {
      if (!seen.has(a.slug)) { seen.add(a.slug); merged.push(a); }
    }
    return merged;
  }, [autoArticles]);

  function goHome() { setPage("home"); window.scrollTo(0, 0); }
  function goBlog() { setPage("blog"); window.scrollTo(0, 0); }

                    <input required placeholder="Pays" className="w-full px-3 py-2 rounded-2xl border text-sm" style={{ borderColor: "rgba(255,255,255,0.08)", background: "#0F0F0F", color: "#FFFFFF" }} />

const EMPTY_TRACTOR = {
  name: "", brand: "", country: "", location: "", power: "", year: "",
  transmission: "", use: "", day: "", week: "", month: "", deposit: "",
  rating: 4.5, images: [FALLBACK_IMG]
};

function AdminPanel({ goSite }) {
  const [tab, setTab] = useState("dashboard");
  const [tractors, setTractors] = useState(TRACTORS);
  const [email, setEmail] = useState("tractorent@mail4.uk");

  // Formulaire d'ajout / modification de tracteur
  const [formOpen, setFormOpen] = useState(false);
  const [formData, setFormData] = useState(EMPTY_TRACTOR);
  const [editingId, setEditingId] = useState(null);
  const fileInputRef = useRef(null);

  // Paramètres SITE (maintenant modifiables et enregistrables)
  const [siteName, setSiteName] = useState("TractoRent");
  const [seoTitle, setSeoTitle] = useState("TractoRent — Location de tracteurs à l'international");
  const [seoDesc, setSeoDesc] = useState("Comparez et réservez des tracteurs partout dans le monde.");
  const [siteSaved, setSiteSaved] = useState(false);

  const tabs = [
    { id: "dashboard", label: "Tableau de bord", icon: <LayoutDashboard size={16} /> },
    { id: "tractors", label: "Tracteurs", icon: <Tractor size={16} /> },
    { id: "bookings", label: "Réservations", icon: <ClipboardList size={16} /> },
    { id: "site", label: "SITE", icon: <Settings size={16} /> },
    { id: "ai", label: "AI Command Center", icon: <Bot size={16} /> },
  ];

  function removeTractor(id) {
    setTractors(tractors.filter(t => t.id !== id));
  }

  function openAddForm() {
    setEditingId(null);
    setFormData(EMPTY_TRACTOR);
    setFormOpen(true);
  }

  function openEditForm(t) {
    setEditingId(t.id);
    setFormData({ ...t });
    setFormOpen(true);
  }

  function closeForm() {
    setFormOpen(false);
  }

  function addImageUrl(url) {
    const clean = url.trim();
    if (!clean) return;
    setFormData(f => ({ ...f, images: [...(f.images || []).filter(i => i !== FALLBACK_IMG), clean] }));
  }

  function removeImageAt(index) {
    setFormData(f => {
      const next = (f.images || []).filter((_, i) => i !== index);
      return { ...f, images: next.length ? next : [FALLBACK_IMG] };
    });
  }

  function handleImageFiles(fileList) {
    Array.from(fileList).forEach(file => {
      const reader = new FileReader();
      reader.onload = () => {
        setFormData(f => ({ ...f, images: [...(f.images || []).filter(i => i !== FALLBACK_IMG), reader.result] }));
      };
      reader.readAsDataURL(file);
    });
  }

  function saveTractorForm(e) {
    e.preventDefault();
    const clean = {
      ...formData,
      power: Number(formData.power) || 0,
      year: Number(formData.year) || new Date().getFullYear(),
      day: Number(formData.day) || 0,
      week: Number(formData.week) || 0,
      month: Number(formData.month) || 0,
      deposit: Number(formData.deposit) || 0,
      rating: Number(formData.rating) || 4.5,
      images: formData.images && formData.images.length ? formData.images : [FALLBACK_IMG],
    };
    if (editingId) {
      setTractors(tractors.map(t => t.id === editingId ? { ...clean, id: editingId } : t));
    } else {
      const nextId = tractors.length ? Math.max(...tractors.map(t => t.id)) + 1 : 1;
      setTractors([...tractors, { ...clean, id: nextId }]);
    }
    setFormOpen(false);
  }

  function saveSiteSettings() {
    setSiteSaved(true);
    setTimeout(() => setSiteSaved(false), 2500);
  }

  return (

        <nav className="flex-1 px-3 space-y-1">
          {tabs.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)}

              {t.icon}{t.label}
            </button>

        </nav>
        <button onClick={goSite} className="m-3 text-xs px-3 py-2 rounded-2xl text-left" style={{ color: "#BFE3C8" }}>

            </div>

                <thead style={{ background: "#0F0F0F" }}>

              <div className="flex items-center justify-between p-5 border-b" style={{ borderColor: "rgba(255,255,255,0.08)" }}>

                <button onClick={closeForm}><X size={18} color="#9CA3AF" /></button>

          <div>
            <h1 className="text-2xl font-bold mb-6" style={{ color: "#FFFFFF", fontFamily: "'Space Grotesk', sans-serif" }}>Réservations</h1>
            <div className="rounded-2xl border overflow-hidden" style={{ borderColor: "rgba(255,255,255,0.08)", background: "#1C1C1C" }}>
              {[
                ["Amine B.", "Case IH Puma 240", "En attente"],
                ["Julien F.", "John Deere 6155R", "Acceptée"],
                ["Marta G.", "Massey Ferguson 5713", "Refusée"],
              ].map(([name, tractor, status], i) => (
                <div key={i} className="flex items-center justify-between p-4 border-b last:border-b-0" style={{ borderColor: "rgba(255,255,255,0.06)" }}>
                  <div>
                    <p className="font-medium text-sm" style={{ color: "#FFFFFF" }}>{name}</p>
                    <p className="text-xs" style={{ color: "#9CA3AF" }}>{tractor}</p>
                  </div>
                  <span className="text-xs font-semibold px-2.5 py-1 rounded-full" style={{
                    background: status === "Acceptée" ? "rgba(34,197,94,0.15)" : status === "Refusée" ? "rgba(239,68,68,0.15)" : "rgba(255,255,255,0.12)",
                    color: status === "Acceptée" ? "#22C55E" : status === "Refusée" ? "#EF4444" : "#6B6B6B"
                  }}>{status}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {tab === "site" && (
          <div>
            <h1 className="text-2xl font-bold mb-6" style={{ color: "#FFFFFF", fontFamily: "'Space Grotesk', sans-serif" }}>SITE</h1>
            <div className="grid md:grid-cols-2 gap-6">
              <div className="p-5 rounded-2xl border space-y-3" style={{ borderColor: "rgba(255,255,255,0.08)", background: "#1C1C1C" }}>
                <h3 className="font-semibold" style={{ color: "#FFFFFF" }}>Email officiel</h3>
                <input value={email} onChange={e => setEmail(e.target.value)}
                  className="w-full px-3 py-2 rounded-2xl border text-sm" style={{ borderColor: "rgba(255,255,255,0.08)", background: "#0F0F0F", color: "#FFFFFF" }} />
                <p className="text-xs" style={{ color: "#9CA3AF" }}>Utilisée pour toutes les communications du site.</p>
              </div>
              <div className="p-5 rounded-2xl border space-y-3" style={{ borderColor: "rgba(255,255,255,0.08)", background: "#1C1C1C" }}>
                <h3 className="font-semibold" style={{ color: "#FFFFFF" }}>Nom du site</h3>
                <input value={siteName} onChange={e => setSiteName(e.target.value)} className="w-full px-3 py-2 rounded-2xl border text-sm" style={{ borderColor: "rgba(255,255,255,0.08)", background: "#0F0F0F", color: "#FFFFFF" }} />
              </div>
              <div className="p-5 rounded-2xl border space-y-3" style={{ borderColor: "rgba(255,255,255,0.08)", background: "#1C1C1C" }}>
                <h3 className="font-semibold" style={{ color: "#FFFFFF" }}>SEO</h3>
                <input value={seoTitle} onChange={e => setSeoTitle(e.target.value)} className="w-full px-3 py-2 rounded-2xl border text-sm" style={{ borderColor: "rgba(255,255,255,0.08)", background: "#0F0F0F", color: "#FFFFFF" }} />
                <textarea value={seoDesc} onChange={e => setSeoDesc(e.target.value)} rows={2} className="w-full px-3 py-2 rounded-2xl border text-sm" style={{ borderColor: "rgba(255,255,255,0.08)", background: "#0F0F0F", color: "#FFFFFF" }} />
              </div>
              <div className="p-5 rounded-2xl border space-y-3" style={{ borderColor: "rgba(255,255,255,0.08)", background: "#1C1C1C" }}>
                <h3 className="font-semibold" style={{ color: "#FFFFFF" }}>Couleurs</h3>
                <div className="flex gap-2">
                  {["#2F6B3F", "#2F6B3F", "#2F6B3F", "#22C55E", "#EF4444"].map(c => (
                    <div key={c} className="w-8 h-8 rounded-md border" style={{ background: c, borderColor: "rgba(255,255,255,0.08)" }} />
                  ))}
                </div>
              </div>
            </div>
            <div className="flex items-center gap-3 mt-6">
              <button onClick={saveSiteSettings} className="flex items-center gap-2 text-sm font-semibold px-4 py-2.5 rounded-2xl transition-all duration-300 hover:scale-105 hover:brightness-110"
                style={{ background: "linear-gradient(135deg, #1B4B2A, #2F6B3F)", color: "#FFFFFF", boxShadow: "0 0 14px rgba(47,107,63,0.15)" }}>
                <Check size={16} /> Enregistrer
              </button>
              {siteSaved && (
                <span className="text-sm font-medium" style={{ color: "#22C55E" }}>Modifications enregistrées ✓</span>
              )}
            </div>
          </div>
        )}

        {tab === "ai" && (
          <div>
            <h1 className="text-2xl font-bold mb-2" style={{ color: "#FFFFFF", fontFamily: "'Space Grotesk', sans-serif" }}>AI Command Center</h1>
            <p className="text-sm mb-6" style={{ color: "#9CA3AF" }}>Aperçu — nécessite un backend planifié pour tourner réellement en continu.</p>
            <div className="grid md:grid-cols-3 gap-4 mb-6">
              {[
                { icon: <TrendingUp size={16} />, title: "AI Growth Director", desc: "SEO, contenu, articles de blog" },
                { icon: <Sparkles size={16} />, title: "AI Market Intelligence", desc: "Tendances et opportunités marché" },
                { icon: <Bot size={16} />, title: "AI Customer Assistant", desc: "Support client 24/7" },
              ].map((a, i) => (
                <div key={i} className="p-5 rounded-2xl border" style={{ borderColor: "rgba(255,255,255,0.08)", background: "#1C1C1C" }}>
                  <div className="w-9 h-9 rounded-2xl flex items-center justify-center mb-3" style={{ background: "rgba(47,107,63,0.15)", color: "#2F6B3F", boxShadow: "0 0 12px rgba(47,107,63,0.15)" }}>{a.icon}</div>
                  <h3 className="font-semibold text-sm mb-1" style={{ color: "#FFFFFF" }}>{a.title}</h3>
                  <p className="text-xs" style={{ color: "#9CA3AF" }}>{a.desc}</p>
                </div>
              ))}
            </div>
            <div className="p-5 rounded-2xl border" style={{ borderColor: "rgba(255,255,255,0.08)", background: "#1C1C1C" }}>
              <h3 className="font-semibold mb-3" style={{ color: "#FFFFFF" }}>Rapport des dernières 24h</h3>
              <ul className="space-y-3 text-sm">
                {AI_LOG.map((l, i) => (
                  <li key={i} className="flex gap-3">
                    <span className="font-mono text-xs shrink-0 w-12" style={{ color: "#9CA3AF" }}>{l.time}</span>
                    <div>
                      <span className="font-semibold text-xs" style={{ color: "#2F6B3F" }}>{l.who}</span>
                      <p style={{ color: "#FFFFFF" }}>{l.text}</p>
                    </div>
                  </li>
                ))}
              </ul>
            </div>
          </div>
        )}
      </main>
    </div>
  );
}

/* ---------------------------------------------------------
   ROOT
--------------------------------------------------------- */

function App() {
  const [view, setView] = useState("site");
  return (
    <>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap');`}</style>
      {view === "site"
        ? <PublicSite goAdmin={() => setView("admin")} />
        : <AdminPanel goSite={() => setView("site")} />}
    </>
  );
}


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);

</script>
</body>
</html>
